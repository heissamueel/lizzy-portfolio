<style>
:root{--bg:#0f0718;--text:#f6efff;--muted:#c3b3da;--ga:rgba(255,255,255,.17);--gb:rgba(255,255,255,.04);--gl:rgba(255,255,255,.26);--sh:rgba(0,0,0,.35);--acc:#c9a7ff;--hot:#ff4d94;--b1:#ff3d8b;--b2:#7c4dff;--b3:#b388ff;--ov:rgba(15,7,24,.38)}
[data-theme=light]{--bg:#fdf3ff;--text:#2a1340;--muted:#62497c;--ga:rgba(255,255,255,.75);--gb:rgba(255,255,255,.35);--gl:rgba(255,255,255,.95);--sh:rgba(120,60,180,.22);--acc:#7a3fd1;--hot:#d81b73;--b1:#ff9ac8;--b2:#b9a0ff;--b3:#ffd1e8;--ov:rgba(253,243,255,.4)}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth;scroll-padding-top:90px}
body{font-family:Figtree,system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.6;overflow-x:hidden;transition:background .5s,color .5s}
body.lock{overflow:hidden}
img{max-width:100%;display:block}a{color:inherit}
:focus-visible{outline:2px solid var(--acc);outline-offset:3px}
h1,h2,h3{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;line-height:1.1}
.wrap{max-width:1040px;margin:0 auto;padding:0 20px}
section{padding:56px 0}
h2{font-size:clamp(1.8rem,5vw,2.8rem);margin-bottom:26px}
.muted{color:var(--muted)}
/* living background */
.bg{position:fixed;inset:0;z-index:-2;overflow:hidden}
.bg i{position:absolute;width:55vmax;height:55vmax;border-radius:50%;filter:blur(70px);opacity:.55;animation:drift 22s ease-in-out infinite alternate}
.bg i:nth-child(1){background:var(--b1);top:-15%;left:-15%}
.bg i:nth-child(2){background:var(--b2);bottom:-20%;right:-15%;animation-delay:-8s}
.bg i:nth-child(3){background:var(--b3);top:35%;left:35%;width:35vmax;height:35vmax;animation-delay:-14s}
@keyframes drift{to{transform:translate(12vw,9vh) scale(1.15)}}
.ib{width:42px;height:42px;border-radius:50%;border:0;color:var(--text);cursor:pointer;display:grid;place-items:center;font:inherit}
.ib:active{transform:scale(.9)}
.sm{width:24px;height:24px;transition:transform .7s cubic-bezier(.5,1.6,.4,1)}
.sm .cut{transition:transform .6s cubic-bezier(.5,1.4,.4,1)}
.sm .rays{transform-origin:12px 12px;transition:transform .6s,opacity .4s}
[data-theme=dark] .sm{transform:rotate(-40deg)}
[data-theme=dark] .sm .cut{transform:translate(-8px,7px)}
[data-theme=dark] .sm .rays{transform:scale(.2);opacity:0}
.burger{width:20px;height:14px;position:relative}
.burger::before,.burger::after{content:"";position:absolute;left:0;right:0;height:2px;background:currentColor;border-radius:2px;transition:transform .4s,top .4s}
.burger::before{top:2px}.burger::after{top:10px}
.open .burger::before{top:6px;transform:rotate(45deg)}.open .burger::after{top:6px;transform:rotate(-45deg)}
/* menu overlay: page stays visible, blurred */
#menu{position:fixed;inset:0;z-index:20;background:var(--ov);-webkit-backdrop-filter:blur(26px) saturate(1.5);backdrop-filter:blur(26px) saturate(1.5);display:grid;place-content:center;gap:6px;text-align:center;opacity:0;visibility:hidden;transition:opacity .4s,visibility .4s}
.open #menu{opacity:1;visibility:visible}
#menu a{font-family:'Bricolage Grotesque';font-weight:800;font-size:clamp(2rem,8vw,3.2rem);text-decoration:none;padding:4px 0;transform:translateY(24px);opacity:0;transition:transform .5s,opacity .5s,color .2s}
#menu a:hover{color:var(--hot)}
.open #menu a{transform:none;opacity:1}
.open #menu a:nth-child(2){transition-delay:.05s}.open #menu a:nth-child(3){transition-delay:.1s}.open #menu a:nth-child(4){transition-delay:.15s}.open #menu a:nth-child(5){transition-delay:.2s}.open #menu a:nth-child(6){transition-delay:.25s}
/* hero */
.hero{padding-top:100px}
.banner{border-radius:28px;padding:8px}
.banner img{border-radius:21px;width:100%;aspect-ratio:3/1;object-fit:cover}
.badge{position:absolute;left:22px;bottom:22px;display:flex;align-items:center;gap:10px;padding:6px 16px 6px 6px;border-radius:999px;font-size:.9rem;font-weight:600}
.badge img{width:40px;height:40px;border-radius:50%;object-fit:cover;aspect-ratio:1}
.badge i{width:9px;height:9px;border-radius:50%;background:#4ade80;box-shadow:0 0 0 0 rgba(74,222,128,.6);animation:ping 2s infinite}
@keyframes ping{to{box-shadow:0 0 0 9px rgba(74,222,128,0)}}
h1{font-size:clamp(2.3rem,7vw,4.6rem);margin:34px 0 14px;letter-spacing:-.02em}
#rot{display:inline-block;color:var(--hot);transition:opacity .3s,transform .3s}
#rot.out{opacity:0;transform:translateY(-14px)}
.lede{font-size:1.15rem;max-width:56ch;color:var(--muted);margin-bottom:26px}
.cta{display:flex;gap:12px;flex-wrap:wrap}
.btn{display:inline-block;padding:14px 26px;border-radius:999px;font-weight:600;text-decoration:none;color:#fff;background:linear-gradient(135deg,var(--hot),#8b5cf6);border:0;cursor:pointer;font:inherit;font-weight:600;box-shadow:0 10px 30px rgba(255,61,139,.35);transition:transform .25s}
.btn:hover{transform:translateY(-3px) scale(1.03)}
/* ticker */
.tick{overflow:hidden;padding:14px 0;border-block:1px solid var(--gl);margin:10px 0;-webkit-mask:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent);mask:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent)}
.tick div{display:flex;width:max-content;animation:run 32s linear infinite}
.tick span{padding:0 18px;font-family:'Bricolage Grotesque';font-weight:800;font-size:1.3rem;white-space:nowrap}
.tick span::after{content:"✦";margin-left:36px;color:var(--hot)}
@keyframes run{to{transform:translateX(-50%)}}
/* cards */
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,290px),1fr));gap:16px}
.card{border-radius:26px;padding:26px;transition:transform .2s ease-out;transform-style:preserve-3d}
.card .ico{font-size:1.9rem;display:block;margin-bottom:10px}
.card h3{font-size:1.4rem;margin-bottom:4px}
.card .role{color:var(--acc);font-weight:600;font-size:.95rem;margin-bottom:12px}
.card p{color:var(--muted)}
.card ul{margin:12px 0 0 18px;color:var(--muted)}.card li{margin:3px 0}.card li::marker{color:var(--hot)}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.tags em{font-style:normal;font-size:.8rem;padding:3px 11px;border-radius:999px;border:1px solid var(--gl);color:var(--text)}
.big{grid-column:1/-1;display:grid;grid-template-columns:auto 1fr;gap:10px 34px;align-items:center}
.big b{font-family:'Bricolage Grotesque';font-weight:800;font-size:clamp(3.6rem,13vw,7rem);line-height:1;background:linear-gradient(135deg,var(--hot),var(--acc));-webkit-background-clip:text;background-clip:text;color:transparent}
@media(max-width:640px){.big{grid-template-columns:1fr}}
/* proof */
.shots{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:16px;margin-top:8px}
.shot{border-radius:22px;padding:8px;cursor:zoom-in;border:1px solid var(--gl);background:none;color:inherit;text-align:left;font:inherit}
.shot img{border-radius:15px;width:100%;height:auto}.shot span{display:block;padding:10px 8px 4px;font-size:.9rem;color:var(--muted)}
#lb{position:fixed;inset:0;z-index:50;background:rgba(10,4,18,.8);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);display:none;place-items:center;padding:20px;cursor:zoom-out}
#lb.on{display:grid}#lb img{max-height:90vh;border-radius:16px}
/* quotes */
.qs{display:flex;gap:16px;overflow-x:auto;scroll-snap-type:x mandatory;padding:6px 2px 18px}
.q{flex:0 0 min(84%,380px);scroll-snap-align:start;border-radius:24px;padding:24px}
.q p{font-size:1.08rem}.q cite{display:block;margin-top:12px;font-style:normal;color:var(--acc);font-weight:600}
/* contact */
.contact{display:grid;grid-template-columns:1fr 1fr;gap:28px;align-items:start}
@media(max-width:800px){.contact{grid-template-columns:1fr}}
.panel{border-radius:28px;padding:28px}
form{display:grid;gap:14px}label{display:grid;gap:6px;font-weight:500;font-size:.95rem}

<script>
(function(){
var d=document,R=d.documentElement,B=d.body,rm=matchMedia('(prefers-reduced-motion:reduce)').matches;
// theme
var tb=d.getElementById('theme');
function setT(t){R.setAttribute('data-theme',t);tb.setAttribute('aria-pressed',t==='dark')}
var sv=null;try{sv=localStorage.getItem('theme')}catch(e){}setT(sv||'dark');
tb.onclick=function(){var t=R.getAttribute('data-theme')==='dark'?'light':'dark';setT(t);try{localStorage.setItem('theme',t)}catch(e){}};
// menu
var mb=d.getElementById('mb');
function menu(o){B.classList.toggle('open',o);B.classList.toggle('lock',o);mb.setAttribute('aria-expanded',o)}
mb.onclick=function(){menu(!B.classList.contains('open'))};
d.querySelectorAll('#menu a').forEach(function(a){a.onclick=function(){menu(false)}});
d.addEventListener('keydown',function(e){if(e.key==='Escape'){menu(false);lb.classList.remove('on')}});
// rotating word
var rot=d.getElementById('rot'),w=['engaged','active','organized','loyal','thriving'],i=0;
if(!rm)setInterval(function(){rot.classList.add('out');setTimeout(function(){i=(i+1)%w.length;rot.textContent=w[i];rot.classList.remove('out')},300)},2400);
// reveal + count up
var io=new IntersectionObserver(function(es){es.forEach(function(e){if(!e.isIntersecting)return;var t=e.target;t.classList.add('in');
 if(t.dataset.n){var n=+t.dataset.n,s=t.dataset.s||'',st=performance.now();(function f(now){var p=Math.min((now-st)/1400,1);t.textContent=Math.round(n*(1-Math.pow(1-p,3)))+(p===1?s:'');if(p<1)requestAnimationFrame(f)})(st)}
 io.unobserve(t)})},{threshold:.25});
d.querySelectorAll('.rv,[data-n]').forEach(function(el){io.observe(el)});
// glass spotlight + tilt + cursor glow
var glow=d.getElementById('glow'),fine=matchMedia('(hover:hover)').matches;
d.querySelectorAll('.glass').forEach(function(el){el.addEventListener('pointermove',function(e){var r=el.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;el.style.setProperty('--mx',x+'px');el.style.setProperty('--my',y+'px');
 if(fine&&!rm&&el.hasAttribute('data-tilt'))el.style.transform='perspective(800px) rotateX('+((y/r.height-.5)*-7)+'deg) rotateY('+((x/r.width-.5)*7)+'deg)'});
 el.addEventListener('pointerleave',function(){if(el.hasAttribute('data-tilt'))el.style.transform=''})});
if(fine)addEventListener('pointermove',function(e){glow.style.opacity=1;glow.style.transform='translate('+e.clientX+'px,'+e.clientY+'px)'});
// lightbox
var lb=d.getElementById('lb'),li=lb.querySelector('img');
d.querySelectorAll('.shot').forEach(function(b){b.onclick=function(){var im=b.querySelector('img');li.src=im.src;li.alt=im.alt;lb.classList.add('on')}});
lb.onclick=function(){lb.classList.remove('on')};
// form
var f=d.getElementById('form'),st=d.getElementById('st');
f.addEventListener('submit',function(e){e.preventDefault();st.textContent='Sending...';
 fetch(f.action,{method:'POST',body:new FormData(f),headers:{Accept:'application/json'}}).then(function(r){if(!r.ok)throw 0;f.reset();st.textContent='Message sent. Lizzy will reply soon.'}).catch(function(){st.textContent='Could not send. Email lizzyfrank022@gmail.com instead.'})});
})();
</script>
